name: planner_estudos
description: "Planner de Provas e Estudos — trabalho NP2 de Desenvolvimento Mobile (Flutter + Firebase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  # Recurso adicional (RF09): consumo da BrasilAPI com o pacote http
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
